services:
  app:
    build:
      context: .
      target: app
    env_file: ./.env
    ports:
      - '${DEV_PORT}:3000'
    volumes:
      - .:/app:z
      - type: bind
        source: ${LIVE_BROWSER_CONTAINER_DATA_HOST_DIR:-./.dev/live-browser-persist}
        target: /app/.dev/live-browser-persist
      - node-dev:/home/node/dev
    environment:
      NODE_ENV: development
      HOST_MACHINE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - climate-map-network

networks:
  climate-map-network:
    external: true

volumes:
  node-dev:
    driver: local
