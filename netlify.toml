[build]
  # @tanstack/react-start 1.131.x uses Nitro target="netlify" and publish="dist".
  # The newer @netlify/vite-plugin-tanstack-start path starts at Start 1.132.0.
  command = "NEXT_PUBLIC_URL=$DEPLOY_PRIME_URL yarn run build:netlify"
  publish = "dist"

[build.environment]
  NEXT_PUBLIC_COMPILED_APPLETS = "main,energiakartta,carbon,luonnonmetsakartat"

[context."hiilikartta_deploy"]
  environment = { NEXT_PUBLIC_COMPILED_APPLETS = "carbon" }

[context."luonnonmetsakartat_deploy"]
  environment = { NEXT_PUBLIC_COMPILED_APPLETS = "luonnonmetsakartat" }
