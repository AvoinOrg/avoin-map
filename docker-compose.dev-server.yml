services:
  dev-server:
    build:
      context: .
      target: dev-server
    env_file: ./.env
    ports:
      - '${DEV_PORT}:3000'
      - '${CODE_SERVER_PORT:-8443}:8080'
    volumes:
      - .:/app:z
      - type: bind
        source: ${LIVE_BROWSER_CONTAINER_DATA_HOST_DIR:-./.dev/live-browser-persist}
        target: /app/.dev/live-browser-persist
      - node-dev:/home/node/dev
      - type: bind
        source: ${CODE_SERVER_HOST_DIR:-./.dev/code-server}
        target: /home/node/code-server
      - type: bind
        source: ${SSH_PATH:?Set SSH_PATH to the host SSH directory}
        target: /home/node/.ssh
        read_only: true
      - type: bind
        source: ${CODEX_PATH:?Set CODEX_PATH to the host Codex directory}/auth.json
        target: /codex-mounts/auth.json
        bind:
          create_host_path: false
      - type: bind
        source: ${CODEX_PATH:?Set CODEX_PATH to the host Codex directory}/.credentials.json
        target: /codex-mounts/.credentials.json
        bind:
          create_host_path: false
      - type: bind
        source: ${CODEX_PATH:?Set CODEX_PATH to the host Codex directory}/rules/default.rules
        target: /codex-mounts/rules/default.rules
        bind:
          create_host_path: false
    environment:
      NODE_ENV: development
      HOST_MACHINE: host.docker.internal
      CODEX_HOME: /app/.codex
      CODE_SERVER_HOME: /home/node/code-server
      FIGMA_MCP_URL: http://host.docker.internal:3845/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - climate-map-network

networks:
  climate-map-network:
    external: true

volumes:
  node-dev:
    driver: local
