services:
  dev-server:
    build:
      context: .
      target: dev-server
    env_file: ./.env
    ports:
      - '${DEV_PORT}:3000'
      - '${CODE_SERVER_PORT:-8443}:8080'
    volumes:
      - .:/app:z
      - type: bind
        source: ${LIVE_BROWSER_CONTAINER_DATA_HOST_DIR:-./.dev/live-browser-persist}
        target: /app/.dev/live-browser-persist
      - node-dev:/home/node/dev
      - type: bind
        source: ${CODE_SERVER_HOST_DIR:-./.dev/code-server}
        target: /home/node/code-server
      - type: bind
        source: ${HOME}/.ssh
        target: /home/node/.ssh
        read_only: true
      - type: bind
        source: ${HOME}/.codex/auth.json
        target: /app/.codex/auth.json
        read_only: true
      - type: bind
        source: ${HOME}/.codex/.credentials.json
        target: /app/.codex/.credentials.json
        read_only: true
      - type: bind
        source: ${HOME}/.codex/rules/default.rules
        target: /app/.codex/rules/default.rules
        read_only: true
    environment:
      NODE_ENV: development
      HOST_MACHINE: host.docker.internal
      CODEX_HOME: /app/.codex
      CODE_SERVER_HOME: /home/node/code-server
      FIGMA_MCP_URL: http://host.docker.internal:3845/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - climate-map-network

networks:
  climate-map-network:
    external: true

volumes:
  node-dev:
    driver: local
