services:
  app-prod:
    profiles: [ prod ]
    # container_name: climate-map-app
    build: .
    env_file: ./.env
    environment:
      NODE_ENV: production
    ports:
      - '${DEV_PORT}:3000'
    volumes:
      - .:/app:z
    entrypoint: '/bin/bash /app/docker-entrypoint.sh'
    networks:
      - climate-map-network

  app-dev:
    profiles: [ dev ]
    # container_name: climate-map-app
    build: .
    env_file: ./.env
    ports:
      - '${DEV_PORT}:3000'
    volumes:
      - .:/app:z
      - type: bind
        source: ${LIVE_BROWSER_CONTAINER_DATA_HOST_DIR:-./.dev/live-browser-persist}
        target: /app/.dev/live-browser-persist
      - node-dev:/home/node/dev
    environment:
      NODE_ENV: development
      HOST_MACHINE: host.docker.internal
    # Add extra_hosts to make host.docker.internal work
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: '/bin/bash /app/docker-entrypoint.sh'
    networks:
      - climate-map-network

networks:
  climate-map-network:
    external: true

volumes:
  node-dev:
    driver: local
