services:
  app-prod:
    profiles: [ prod ]
    container_name: climate-map-app
    build: .
    env_file: ./.env
    environment:
      NODE_ENV: production
    ports:
      - '${DEV_PORT}:3000'
    volumes:
      - .:/app:z
    entrypoint: '/bin/bash /app/docker-entrypoint.sh'
    networks:
      - climate-map-networ

  app-dev:
    profiles: [ dev ]
    container_name: climate-map-app
    build: .
    env_file: ./.env
    ports:
      - '${DEV_PORT}:3000'
    volumes:
      - .:/app:z
      - node-dev:/home/node/dev
      - type: bind
        source: $HOST_SSH_AUTH_SOCK # e.g. /home/<youruser>/.ssh/agent.sock
        target: /ssh-agent
    environment:
      NODE_ENV: development
      SSH_AUTH_SOCK: /ssh-agent
    entrypoint: '/bin/bash /app/docker-entrypoint.sh'
    networks:
      - climate-map-network

networks:
  climate-map-network:
    external: true

volumes:
  node-dev:
    driver: local
